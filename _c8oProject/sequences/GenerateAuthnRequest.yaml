    'function normalizePemValue(value) {
        if (value == null) {
            return "";
        }
        return String(value)
            .replace(/&#(?:10|13|x0*A|x0*D);/gi, "")
            .replace(/<br\s*\/?>/gi, "")
            .replace(/\\r\\n|\\n|\\r/g, "")
            .replace(/-----BEGIN [^-]+-----/gi, "")
            .replace(/-----END [^-]+-----/gi, "")
            .replace(/\s/g, "");
    }
